name: Crypto Signals Scanner

on:
  schedule:
    # Расписание запуска в формате UTC (Московское время = UTC + 3 часа)
    # 04:00 UTC = 07:00 МСК (Азиатская сессия)
    # 07:00 UTC = 10:00 МСК (Открытие Лондона)
    # 10:00 UTC = 13:00 МСК (Обед)
    # 13:00 UTC = 16:00 МСК (Разгар американской сессии)
    # 16:00 UTC = 19:00 МСК (Закрытие Нью-Йорка)
    # 19:00 UTC = 22:00 МСК (Вечерний анализ)
      schedule:
    # Запуск каждые 2 часа с 06:00 до 21:00 по Москве
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch: # Позволяет запустить вручную кнопкой для теста

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_bot.py
