name: Crypto Signals Scanner

on:
  schedule:
    # Запуск каждые 2 часа с 06:00 до 20:00 по Москве (03:00 - 17:00 UTC)
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  
  workflow_dispatch:
    # Позволяет запустить бота вручную кнопкой для теста

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Кэширование pip для ускорения сборки

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_bot.py
